[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "kfretransport"
version = "0.2.6"
description = "Open, tested KFRE/eGFR equations, calibration metrics (including competing-risk O/E with a delta-method variance), multi-site pooling with small-cell masking, a closed-form selection-calibration curve with multi-site power calculations, a within-site nested-window design, an OMOP CDM cohort builder, pre-registered simulations (site-level and person-level) and a pre-registered NHANES study of informative uACR testing (research only, not medical advice)"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.9"
authors = [{name = "MV2, Munim, Inc.", email = "mv2@munimtech.com"}]

[project.optional-dependencies]
nhanes = ["pandas"]

[project.scripts]
kfre-omop = "kfretransport.omop:main"
kfre-pool = "kfretransport.pool:main"
kfre-nhanes = "kfretransport.nhanes:main"
kfre-selection = "kfretransport.selection:main"
kfre-power = "kfretransport.power:main"
kfre-nested = "kfretransport.nested:main"
kfre-sim2 = "kfretransport.sim2:main"

[tool.setuptools]
packages = ["kfretransport"]
